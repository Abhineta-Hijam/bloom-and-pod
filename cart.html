<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Bloom & Pod shopping cart.">
  <title>Your Cart | Bloom & Pod</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html"><img class="logo" src="images/logo.png" alt="My Brand Logo"><span>Bloom &amp; Pod</span></a>
      <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
      <nav class="nav" aria-label="Primary navigation">
        <details class="header-search" id="header-search">
          <summary aria-label="Open product search" title="Search products">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </summary>

          <div class="header-search-panel">
            <label for="header-search-input">Search products</label>
            <div class="header-search-field">
              <input
                id="header-search-input"
                type="search"
                placeholder="Search plants, seeds, pods..."
                autocomplete="off"
              >
              <button type="button" aria-label="View search results">
                &rarr;
              </button>
            </div>            
          <div
            id="header-search-results"
            class="header-search-results"
            aria-live="polite"
            aria-label="Product search suggestions"
            hidden
          ></div>
          </div>
        </details>
        <a href="index.html">Home</a><a href="products.html">Shop</a><a class="active" href="cart.html">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-hero"><div class="container"><p class="eyebrow">Your selection</p><h1>Shopping cart</h1><p>Review your botanicals before checkout.</p></div></section>
    <section class="section"><div class="container cart-layout">
      <div id="cart-items" class="cart-items"></div>
      <aside class="summary" id="cart-summary"></aside>
    </div></section>
  </main>
  <footer class="site-footer">    <div class="container footer-policies" aria-label="Store policies">
      <div class="footer-policies-heading">Policies</div>
      <nav class="footer-policies-links" aria-label="Policy pages">
      <a class="footer-policy-link" href="terms-and-conditions.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9z"/><path d="M8 3v6h6"/><path d="M8 14h8M8 18h8"/></svg>
        <span>Terms &amp; Conditions</span>
      </a>
      <a class="footer-policy-link" href="cancellation-policy.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M8 10h6M8 14h4"/><path d="m16 9 5 5m0-5-5 5"/></svg>
        <span>Cancellation Policy</span>
      </a>
      <a class="footer-policy-link" href="refund-return-policy.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.8 6.5"/><path d="M3 4v7h7"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Refund &amp; Return</span>
      </a>
      <a class="footer-policy-link" href="privacy-policy.html"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg><span>Privacy Policy</span></a></nav>
      </nav>
    </div>
<div class="container footer-bottom"><span>© <span id="year"></span> Bloom &amp; Pod</span><a href="products.html">Continue shopping</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="supabase-client.js"></script>
<script src="script.js?v=2026-10-11.1"></script>
<script>
  history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
</script>
</body>
</html>
