
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search products at Bloom & Pod.">
  <title>Search Results | Bloom & Pod</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <img class="logo" src="images/logo.png" alt="Bloom & Pod">
        <span>Bloom &amp; Pod</span>
      </a>

      <button class="menu-toggle"
              aria-label="Open navigation"
              aria-expanded="false">☰</button>

      <nav class="nav" aria-label="Primary navigation">
         <details class="header-search" id="header-search">
          <summary aria-label="Open product search" title="Search products">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </summary>

          <div class="header-search-panel">
            <label for="header-search-input">Search products</label>            
            <div class="header-search-field">
              <input
                id="header-search-input"
                type="search"
                placeholder="Search plants, seeds, pods..."
                autocomplete="off"
              >
              <button type="button" aria-label="View search results">
                &rarr;
              </button>
            </div>
            <div
              id="header-search-results"
              class="header-search-results"
              aria-live="polite"
              aria-label="Product search suggestions"
              hidden
            ></div>

          </div>
        </details>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="index.html#about">About</a>
        <a href="customer-order.html">Track Order</a>
        <a class="cart-link" href="cart.html">
          Cart <span class="cart-count">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Product discovery</p>
        <h1>Search Results</h1>
        <p id="search-page-query">Loading search...</p>
      </div>
    </section>    
    <section class="section">
        <div class="container">
            <div class="search-page-toolbar">
                <label for="search-page-sort">Sort by</label>
                <select id="search-page-sort">
                    <option value="relevance" selected>Relevance</option>
                    <option value="name">Name: A–Z</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                </select>
            </div>
            <div id="search-page-results" aria-live="polite">
                <p>Loading products...</p>
            </div>
        </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© <span id="year"></span> Bloom &amp; Pod</span>
      <a href="products.html">Continue shopping</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="supabase-client.js"></script>
  <script src="script.js?v=2026-10-11.1"></script> 
    <script>
    /* ==========================================
    DEDICATED SEARCH RESULTS — INITIAL LOAD
    ========================================== */

    document.addEventListener("DOMContentLoaded", async () => {
    const queryLabel = document.getElementById("search-page-query");
    const container = document.getElementById("search-page-results");

    if (!queryLabel || !container) return;

    const params = new URLSearchParams(window.location.search);
    const query = (params.get("q") || "").trim();
    // Preserve the search query in the header input.
    const headerSearchInput = document.getElementById(
    "header-search-input"
    );

    if (headerSearchInput && query) {
    headerSearchInput.value = query;
    }

    container.replaceChildren();

    if (query.length < 2) {
        queryLabel.textContent = "Enter at least 2 characters to search.";
        return;
    }

    queryLabel.textContent = `Results for "${query}"`;

    const status = document.createElement("p");
    status.textContent = "Searching products...";
    container.appendChild(status);

    try {
        const sortSelect = document.getElementById("search-page-sort");
        const allowedSorts = [
        "relevance",
        "name",
        "price_asc",
        "price_desc"
        ];

        const requestedSort = new URLSearchParams(
        window.location.search
        ).get("sort");

        if (allowedSorts.includes(requestedSort)) {
        sortSelect.value = requestedSort;
        }
        sortSelect.addEventListener("change", () => {
        const url = new URL(window.location.href);
        url.searchParams.set("sort", sortSelect.value);
        window.location.assign(url.toString());
        });

        const { data, error } = await window.bpSupabase.rpc(
        "search_store_products_sorted",
        {
            search_text: query,
            sort_by: sortSelect.value,
            page_size: 20,
            page_offset: 0
        }
        );

        if (error) throw error;

        container.replaceChildren();

        if (!data || !data.length) {
        const empty = document.createElement("p");
        empty.textContent = "No matching products found.";
        container.appendChild(empty);
        return;
        }

        const PAGE_SIZE = 20;
        let nextOffset = 0;
        let isLoadingMore = false;

        const list = document.createElement("div");
        list.className = "search-page-list";

        function appendSearchProducts(rows) {
        rows.forEach(row => {
        const product = row.product;
        if (!product) return;

        const item = document.createElement("a");
        item.className = "search-page-item";

        const destination = new URL(
            "catalogue.html",
            window.location.href
        );

        destination.searchParams.set(
            "catalogue",
            product.catalogueSlug
        );

        destination.searchParams.set(
            "product",
            product.id
        );

        item.href = destination.toString();

        const image = document.createElement("img");
        image.className = "search-page-image";
        image.src = product.image || "images/logo.png";
        image.alt = "";
        image.loading = "lazy";

        const details = document.createElement("div");
        details.className = "search-page-details";
        
        const name = document.createElement("strong");

        const productName = String(product.name || "");
        const searchText = query.trim();

        const lowerName = productName.toLocaleLowerCase();
        const lowerQuery = searchText.toLocaleLowerCase();

        let position = 0;
        let matchIndex = lowerName.indexOf(lowerQuery, position);

        while (matchIndex !== -1 && lowerQuery.length > 0) {
        // Add text before the matching substring.
        name.appendChild(
            document.createTextNode(
            productName.slice(position, matchIndex)
            )
        );

        // Highlight the matching substring.
        const highlight = document.createElement("mark");
        highlight.className = "search-match-highlight";
        highlight.textContent = productName.slice(
            matchIndex,
            matchIndex + searchText.length
        );

        name.appendChild(highlight);

        position = matchIndex + searchText.length;
        matchIndex = lowerName.indexOf(lowerQuery, position);
        }

        // Add the remaining product-name text.
        name.appendChild(
        document.createTextNode(productName.slice(position))
        );

        const catalogue = document.createElement("span");
        catalogue.textContent = product.catalogueName;

        details.append(name, catalogue);

        const pricing = document.createElement("div");
        pricing.className = "search-page-pricing";

        if (product.available === false) {
            const unavailable = document.createElement("strong");
            unavailable.className = "search-page-unavailable";
            unavailable.textContent = "Unavailable";
            pricing.appendChild(unavailable);
        } else {
            const price = document.createElement("strong");
            price.textContent =
            `₹${Number(product.price).toLocaleString("en-IN")}/unit`;

            const minimum = document.createElement("span");
            minimum.textContent =
            `Min. ${product.minQty} units`;

            pricing.append(price, minimum);
        }

            item.append(image, details, pricing);
                list.appendChild(item);
            });
            }
            
            appendSearchProducts(data);

            container.appendChild(list);

            // ==========================================
            // SEARCH RESULTS — LOAD MORE
            // ==========================================

            nextOffset = data.length;

            const loadMoreWrapper = document.createElement("div");
            loadMoreWrapper.className = "search-page-load-more";

            const loadMoreButton = document.createElement("button");
            loadMoreButton.type = "button";
            loadMoreButton.className = "btn btn-secondary";
            loadMoreButton.textContent = "Load More";

            loadMoreWrapper.appendChild(loadMoreButton);
            container.appendChild(loadMoreWrapper);

            // A full batch may have more results after it.
            loadMoreWrapper.hidden = data.length < PAGE_SIZE;

            loadMoreButton.addEventListener("click", async () => {
            if (isLoadingMore) return;

            isLoadingMore = true;
            loadMoreButton.disabled = true;
            loadMoreButton.textContent = "Loading...";

            try {
                const { data: nextData, error: nextError } =
                await window.bpSupabase.rpc(
                    "search_store_products_sorted",
                    {
                        search_text: query,
                        sort_by: sortSelect.value,
                        page_size: PAGE_SIZE,
                        page_offset: nextOffset
                    }
                    );

                if (nextError) throw nextError;

                const rows = nextData || [];

                // Append results beneath existing products.
                appendSearchProducts(rows);

                nextOffset += rows.length;

                // No further pages once fewer than 20 are returned.
                if (rows.length < PAGE_SIZE) {
                loadMoreWrapper.hidden = true;
                }
            } catch (error) {
                console.error("Load More failed:", error);

                // Keep the button available for another attempt.
                loadMoreButton.textContent = "Try Again";
                return;
            } finally {
                isLoadingMore = false;
                loadMoreButton.disabled = false;

                if (!loadMoreWrapper.hidden &&
                    loadMoreButton.textContent !== "Try Again") {
                loadMoreButton.textContent = "Load More";
                }
            }
            });
        

    } catch (error) {
        console.error("Search results failed:", error);
        container.replaceChildren();

        const message = document.createElement("p");
        message.textContent =
        "Unable to load search results. Please try again.";

        container.appendChild(message);
    }
    });
    </script>

</body>
</html>
