<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Shop plants, pods, seeds and plant care products from Bloom & Pod."
  >
  <title>Shop | Bloom & Pod</title>
  <link rel="stylesheet" href="style.css">
  <style>
.catalogue-section{
  position:relative;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  overflow:hidden;
}
.catalogue-section::before{
  content:"";
  position:absolute;
  inset:0;
  background:transparent;
  pointer-events:none;
}
.catalogue-section.has-image::before{
  background:rgba(0,0,0,.28);
}
.catalogue-section > a{
  position:relative;
  z-index:1;
  display:block;
  color:inherit;
  text-decoration:none;
}
.catalogue-section.has-image{
  color:#fff;
}
.catalogue-section.has-image .eyebrow,
.catalogue-section.has-image h1,
.catalogue-section.has-image p{
  color:#fff;
}
.catalogue-badge{
  display:inline-block;
  margin-top:10px;
  padding:5px 10px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.catalogue-loading,
.catalogue-empty,
.catalogue-error{
  text-align:center;
}
/* ==========================================
   CATALOGUE LIST — STAGGERED FADE-IN
   ========================================== */
@keyframes catalogueFadeIn {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
#catalogueList .catalogue-section {
  animation: catalogueFadeIn 460ms ease-out both;
  animation-delay: var(--catalogue-delay, 0ms);
}
/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
  #catalogueList .catalogue-section {
    animation: none;
  }
}
</style>
</head>

        <a href="index.html#about">About</a>

    </div>

  <main>

</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="supabase-client.js"></script>
<script src="script.js?v=2026-10-11.1"></script>
<script>
function escapeCatalogueHtml(value){
  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[char])
    );
}
function getCatalogueUrl(slug){
  return (
    'catalogue.html?catalogue=' +
    encodeURIComponent(slug)
  );
}
async function loadCatalogues(){
  const container =
    document.getElementById(
      'catalogueList'
    );
  if(!container){
    return;
  }
  try{
    const { data, error } =
      await window.bpSupabase
        .from('catalogues')
        .select(`
          id,
          name,
          slug,
          eyebrow,
          description,
          image_url,
          badge,
          display_order,
          active
        `)
        .eq('active', true)
        .order(
          'display_order',
          {
            ascending:true
          }
        );
    if(error){
      throw error;
    }
    const catalogues =
      data || [];
    if(!catalogues.length){
      container.innerHTML = `
        <section
          class="page-hero hero-gap product-hero-pad"
        >
          <div class="container catalogue-empty">
            <p>
              No catalogues are currently available.
            </p>
          </div>
        </section>
      `;
      return;
    }
    container.innerHTML =
      catalogues
        .map(
          (catalogue, index) => {
            const image =
              String(
                catalogue.image_url || ''
              ).trim();
            const badge =
              String(
                catalogue.badge || ''
              ).trim();
            const sectionClasses = [
  'page-hero',
  'hero-gap',
  'product-hero-pad',
  'catalogue-section'
];
            if(image){
              sectionClasses.push(
                'has-image'
              );
            }
                  return `
                    <section
                      class="${sectionClasses.join(' ')}"
                      style="
                        ${image
                          ? `background-image:url('${escapeCatalogueHtml(image)}');`
                          : ''}
                        --catalogue-delay:${index * 100}ms;
                      "
                    >
                <a
                  href="${getCatalogueUrl(
                    catalogue.slug
                  )}"
                >
                  <div class="container">
                    ${
                      catalogue.eyebrow
                        ? `
                          <p class="eyebrow">
                            ${
                              escapeCatalogueHtml(
                                catalogue.eyebrow
                              )
                            }
                          </p>
                        `
                        : ''
                    }
                    <h1>
                      ${
                        escapeCatalogueHtml(
                          catalogue.name
                        )
                      }
                    </h1>
                    ${
  catalogue.description
    ? `
      <div class="catalogue-list-description">
        ${
          typeof sanitizeRichTextHtml ===
          'function'
            ? sanitizeRichTextHtml(
                catalogue.description
              )
            : ''
        }
      </div>
    `
    : ''
}
                    ${
                      badge
                        ? `
                          <p>
                            <span class="catalogue-badge">
                              ${
                                escapeCatalogueHtml(
                                  badge
                                )
                              }
                            </span>
                          </p>
                        `
                        : ''
                    }
                    <p>
                      ⮩ Click to browse catalogue.
                    </p>
                  </div>
                </a>
              </section>
            `;
          }
        )
        .join('');
  } catch(error){
    console.error(
      'Catalogue loading failed:',
      error
    );
    container.innerHTML = `
      <section
        class="page-hero hero-gap product-hero-pad"
      >
        <div class="container catalogue-error">
          <p>
            Catalogues could not be loaded.
            Please refresh the page.
          </p>
        </div>
      </section>
    `;
  }
}
document.addEventListener(
  'DOMContentLoaded',
  loadCatalogues
);
</script>
  <script>
    history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
</body>
